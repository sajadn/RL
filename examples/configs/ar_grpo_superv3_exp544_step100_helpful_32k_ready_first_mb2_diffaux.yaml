# 32K generation / 28K thinking with positive-completion diffusion CE.
# Preserve the 48K context, ready-first sampler, TP8/CP1 and microbatch sizes of 2.
defaults: ar_grpo_superv3_exp544_step100_helpful_32k_ready_first_mb2.yaml

policy:
  worker_extension_cls_fqn: ar_grpo.positive_diffusion_policy.PositiveDiffusionARPolicy
  diffusion_aux_loss:
    type: diffusion
    weight: 0.1
    positive_samples: advantage
    mask_token_id: 100
    block_size: 16
    mask_probability_min: 0.05
    mask_probability_max: 1.0
    seed: 42
