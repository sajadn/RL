# Hybrid: diffusion (block leftmost) rollouts + AR causal GRPO loss.
#
# Rollouts are generated by BLOCK DIFFUSION -- the same SGLang FastDiffuser
# leftmost semi-AR decode at block_size=16 that BlockJustGRPO uses -- but the
# policy gradient is the plain AUTOREGRESSIVE GRPO loss: the inherited
# NemotronDiffusionMegatronPolicyWorker forces the causal attention path for
# train/get_logprobs, so prev and training logprobs are single teacher-forced
# causal forwards over the diffusion-generated trajectories. This trains the
# model's AR capability on samples drawn from its own diffusion mode.
#
# Why this is sound with no code changes: loss_fn.use_importance_sampling_
# correction is false in the inherited chain, so the dLLM engine's generation
# logprobs never enter the loss. The PPO ratio (prev vs current) is computed
# consistently under the causal factorization; diffusion rollouts are simply
# off-policy samples w.r.t. it. gen_kl diagnostics compare dLLM generation
# logprobs against causal logprobs -- apples-to-oranges, ignore those curves.
#
# block_size consistency (generation side only -- the causal loss ignores
# block structure): hf_config_overrides.block_size=16 fixes the SGLang engine
# block structure at init (not runtime-reconfigurable) and the FastDiffuser
# decode config below agrees at 16. max_new_tokens stays 3744 (inherited),
# divisible by 16 -- a non-multiple crashes generation with a RoPE view error.
#
# Training memory is the AR profile (single causal forward), so the AR chain's
# validated mb=4 / logprob=4 at 4096 are inherited unchanged.
defaults: "deepscaler_nemotron_labs_diffusion_3b_sglang_ar_megatron.yaml"

policy:
  # Overriding block_size re-runs the one-time HF->mcore conversion under a
  # separate cache path and fixes the SGLang engine block_size at 16. The
  # Megatron-side causal train/logprob path does not use it.
  hf_config_overrides:
    block_size: 16

  generation:
    # Validation decodes with FastDiffuser confidence (threshold 0.9), matching
    # the DiffuGRPO / BlockJustGRPO configs so val curves are comparable across
    # diffusion-rollout runs. block_size is fixed at 16 from engine init.
    sglang_val_dllm_overrides:
      selection_policy: confidence
      threshold: 0.9
      max_steps: 16
      temperature: 1.0
    sglang_cfg:
      # dLLM engine settings mirrored from the DiffuGRPO chain.
      max_running_requests: 4
      disable_cuda_graph: true
      disable_piecewise_cuda_graph: true
      # Clobber the AR chain's '{"ar_mode": true}' -- generation must run in
      # diffusion mode.
      json_model_override_args: '{}'
      dllm_algorithm: "FastDiffuser"
      # Leftmost (left-to-right reveal) semi-AR decode at block_size 16 -- the
      # same rollout policy as BlockJustGRPO.
      dllm_algorithm_config: "/home/snorouzi/diffusion_RL/RL/tools/nemotron_diffusion/block_just_grpo_leftmost_dllm_bs16.yaml"

checkpointing:
  checkpoint_dir: "results/grpo-nemotron-diffusion-3b-diffusion-rollout-ar-loss-deepscaler-megatron"

logger:
  log_dir: "logs/grpo-nemotron-diffusion-3b-diffusion-rollout-ar-loss-deepscaler-megatron-sglang"
  wandb:
    name: "grpo-nemotron-diffusion-3b-diffusion-rollout-ar-loss-deepscaler-megatron-sglang"

# cluster stays at the inherited 1 node (AR-profile training memory). Block-
# diffusion rollouts are the throughput bottleneck; scale num_nodes up (the
# production BlockJustGRPO runs use 16) if generation dominates step time.
