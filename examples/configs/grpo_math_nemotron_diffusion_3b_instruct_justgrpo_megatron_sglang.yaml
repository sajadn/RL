# GRPO with JustGRPO leftmost-reveal logprob estimation on the Nemotron-Diffusion
# Ministral-3B Instruct AR checkpoint.
#
# This uses SGLang for rollout generation and Megatron for policy training.
#
# Run with:
#   python examples/run_grpo.py --config examples/configs/grpo_math_nemotron_diffusion_3b_instruct_justgrpo_megatron_sglang.yaml
defaults: "grpo_math_1B_megatron.yaml"

grpo:
  num_prompts_per_step: 32
  num_generations_per_prompt: 16
  max_num_steps: 1000
  val_period: 25
  val_at_start: true
  max_val_samples: 128
checkpointing:
  enabled: true
  checkpoint_dir: "results/grpo-nemotron-diffusion-3b-instruct-justgrpo-megatron-sglang"
  save_period: 10
  model_save_format: "safetensors"
  save_consolidated: false
  save_optimizer: true

policy:
  model_name: "/lustre/fsw/portfolios/coreai/users/snorouzi/checkpoints/Nemotron-Diffusion-Exp-Ministral-3B-Instruct-vllm-ar"
  tokenizer:
    name: ${policy.model_name}
  train_global_batch_size: 512
  train_micro_batch_size: 1
  generation_batch_size: 32
  logprob_batch_size: 2
  max_total_sequence_length: 1024
  precision: "bfloat16"

  logprob_estimation:
    type: "just_grpo_leftmost_reveal"
    reveal_schedule: "fixed_response_window"
    megatron_attention_mode: "inference_block_bidirectional"
    max_reveal_positions: ${policy.generation.max_new_tokens}
    # Nemotron-Diffusion inference defaults to mask token ID 100.
    mask_token_id: 100
    reveal_batch_size: 2
    train_reveal_batch_size: 1

  dtensor_cfg:
    enabled: false

  optimizer: null
  scheduler: null

  sequence_packing:
    enabled: false
    train_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.train_micro_batch_size}}
    logprob_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.logprob_batch_size}}
    algorithm: "modified_first_fit_decreasing"
    sequence_length_round: 64

  make_sequence_length_divisible_by: ${policy.megatron_cfg.tensor_model_parallel_size}

  megatron_cfg:
    enabled: true
    force_reconvert_from_hf: false
    empty_unused_memory_level: 1
    activation_checkpointing: false
    converter_type: "Ministral3ForCausalLM"
    tensor_model_parallel_size: 8
    expert_tensor_parallel_size: 1
    expert_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    context_parallel_size: 1
    pipeline_dtype: ${policy.precision}
    sequence_parallel: true

    optimizer:
      optimizer: "adam"
      lr: 3.0e-7
      min_lr: 3.0e-8
      weight_decay: 0.01
      bf16: true
      fp16: false
      params_dtype: "float32"
      adam_beta1: 0.9
      adam_beta2: 0.999
      adam_eps: 1e-8
      use_distributed_optimizer: true
      use_precision_aware_optimizer: true
      clip_grad: ${policy.max_grad_norm}

    scheduler:
      start_weight_decay: ${policy.megatron_cfg.optimizer.weight_decay}
      end_weight_decay: ${policy.megatron_cfg.optimizer.weight_decay}
      weight_decay_incr_style: "constant"
      lr_decay_style: "constant"
      lr_decay_iters: 1000
      lr_warmup_iters: 13
      lr_warmup_init: 3.0e-8

  generation:
    backend: "sglang"
    max_new_tokens: 1024
    temperature: 1.0
    top_p: 1.0
    top_k: null
    stop_token_ids: null
    stop_strings: null
    sglang_cfg:
      model_path: ${policy.model_name}
      # SGLang sleep/wake is not implemented in this backend yet. Use a single
      # tensor-parallel server so rollout weights are sharded instead of keeping
      # one full inference copy on every GPU alongside Megatron training.
      gpus_per_server: 8
      dtype: ${policy.precision}
      context_length: ${policy.max_total_sequence_length}
      allow_auto_truncate: true
      enable_memory_saver: false
      dp_size: 1
      pp_size: 1
      ep_size: 1
      max_running_requests: 4
      mem_fraction_static: 0.7
      max_total_tokens: null
      skip_server_warmup: true
      disable_cuda_graph: true
      disable_piecewise_cuda_graph: true
      attention_backend: "flashinfer"
      dllm_algorithm: null
      dllm_algorithm_config: null

data:
  max_input_seq_length: 1024

logger:
  log_dir: "logs/grpo-nemotron-diffusion-3b-instruct-justgrpo-megatron-sglang"
  wandb_enabled: false
  tensorboard_enabled: true
  wandb:
    project: "diffusion_rl"
    name: "grpo-nemotron-diffusion-3b-instruct-justgrpo-megatron-sglang"

cluster:
  gpus_per_node: 8
  num_nodes: 1
