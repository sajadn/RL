# GRPO on the converted Nemotron-Diffusion Ministral-3B checkpoint in AR mode.
#
# This uses vLLM for rollout generation and Megatron for policy
# training/logprob computation.
#
# Run with:
#   python examples/run_grpo.py --config examples/configs/grpo_math_nemotron_diffusion_3b_ar_megatron.yaml
defaults: "grpo_math_1B_megatron.yaml"

grpo:
  num_prompts_per_step: 32
  num_generations_per_prompt: 16
  max_num_steps: 1000
  val_period: 25
  val_at_start: true
  max_val_samples: 128

checkpointing:
  enabled: true
  checkpoint_dir: "results/grpo-nemotron-diffusion-3b-ar-megatron"
  save_period: 10
  model_save_format: "safetensors"
  save_consolidated: false
  save_optimizer: true

policy:
  model_name: "/lustre/fsw/portfolios/coreai/users/snorouzi/checkpoints/Nemotron-Diffusion-Exp-Ministral-3B-vllm-ar"
  tokenizer:
    name: ${policy.model_name}
  train_global_batch_size: 512
  train_micro_batch_size: 1
  generation_batch_size: 32
  logprob_batch_size: 2
  max_total_sequence_length: 1024
  precision: "bfloat16"

  dtensor_cfg:
    enabled: false

  optimizer: null
  scheduler: null

  sequence_packing:
    enabled: true
    train_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.train_micro_batch_size}}
    logprob_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.logprob_batch_size}}
    algorithm: "modified_first_fit_decreasing"
    sequence_length_round: 64

  make_sequence_length_divisible_by: ${policy.megatron_cfg.tensor_model_parallel_size}

  megatron_cfg:
    enabled: true
    force_reconvert_from_hf: false
    empty_unused_memory_level: 1
    activation_checkpointing: false
    converter_type: "Ministral3ForCausalLM"
    tensor_model_parallel_size: 1
    expert_tensor_parallel_size: 1
    expert_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    context_parallel_size: 1
    pipeline_dtype: ${policy.precision}
    sequence_parallel: false

    optimizer:
      optimizer: "adam"
      lr: 3.0e-7
      min_lr: 3.0e-8
      weight_decay: 0.01
      bf16: true
      fp16: false
      params_dtype: "float32"
      adam_beta1: 0.9
      adam_beta2: 0.999
      adam_eps: 1e-8
      use_distributed_optimizer: true
      use_precision_aware_optimizer: true
      clip_grad: ${policy.max_grad_norm}

    scheduler:
      start_weight_decay: ${policy.megatron_cfg.optimizer.weight_decay}
      end_weight_decay: ${policy.megatron_cfg.optimizer.weight_decay}
      weight_decay_incr_style: "constant"
      lr_decay_style: "constant"
      lr_decay_iters: 1000
      lr_warmup_iters: 13
      lr_warmup_init: 3.0e-8

  generation:
    backend: "vllm"
    max_new_tokens: 1024
    temperature: 1.0
    top_p: 1.0
    top_k: null
    stop_token_ids: null
    stop_strings: null
    vllm_cfg:
      tensor_parallel_size: 1
      gpu_memory_utilization: 0.6
      max_model_len: ${policy.max_total_sequence_length}
      enforce_eager: false
    mcore_generation_config:
      buffer_size_gb: 10
      num_cuda_graphs: 4
      block_size_tokens: 256
      use_cuda_graphs_for_non_decode_steps: true
      enable_chunked_prefill: false
      unified_memory_level: 0
      max_tokens: 16384

data:
  max_input_seq_length: 1024

logger:
  log_dir: "logs/grpo-nemotron-diffusion-3b-ar-megatron"
  wandb_enabled: false
  tensorboard_enabled: true
  wandb:
    project: "nemo-rl"
    name: "grpo-nemotron-diffusion-3b-ar-megatron"

cluster:
  gpus_per_node: 8
  num_nodes: 1
