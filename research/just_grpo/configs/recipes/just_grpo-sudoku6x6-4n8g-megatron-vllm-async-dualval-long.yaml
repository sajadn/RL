defaults: ./just_grpo-sudoku6x6-4n8g-megatron-vllm-dualval-long.yaml
grpo:
  async_grpo:
    enabled: true
policy:
  generation:
    worker_extension_cls_fqn: block_diffusion.generation.reference_vllm.ReferenceVllmAsyncWorker
    colocated:
      enabled: false
      resources:
        num_nodes: 2
        gpus_per_node: 8
    vllm_cfg:
      async_engine: true
logger:
  log_dir: results/just_grpo_sudoku6x6_vllm_async_dualval
  wandb:
    name: ${oc.env:WANDB_RUN_NAME,just_grpo_sudoku6x6_vllm_async_dualval}
