# Matched Block JustGRPO Sudoku run on the shared block diffusion runtime.
defaults: ../../../block_diffusion/configs/sudoku6x6_megatron.yaml
policy:
  worker_extension_cls_fqn: just_grpo.algorithms.block_just_grpo_policy_worker.BlockJustGRPOPolicyWorker
logger:
  log_dir: results/just_grpo_sudoku6x6_megatron
  wandb:
    name: ${oc.env:WANDB_RUN_NAME,just_grpo_sudoku6x6_megatron}
just_grpo:
  distributed: true
  runtime: megatron
  generation_python: null
  max_generation_kl: 0.05
  training_token_fraction: 1.0
  schedule:
    mask_token_id: 100
    block_size: 16
    reveal_tokens_per_step: 1
  sampling:
    temperature: ${policy.generation.temperature}
    block_size: ${just_grpo.schedule.block_size}
    max_steps: 16
    selection_policy: leftmost
    threshold: 0.9
    returns_reveal_steps: false
    returns_entropy: false
  validation_sampling:
    temperature: ${policy.generation.val_temperature}
    block_size: ${just_grpo.sampling.block_size}
    max_steps: ${just_grpo.sampling.max_steps}
    selection_policy: ${just_grpo.sampling.selection_policy}
    threshold: ${just_grpo.sampling.threshold}
    returns_reveal_steps: ${just_grpo.sampling.returns_reveal_steps}
    returns_entropy: ${just_grpo.sampling.returns_entropy}
