[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "d-opsd"
version = "0.1.0"
description = "On-policy self-distillation for block diffusion language models"
readme = "README.md"
requires-python = ">=3.13.14,<3.14"
dependencies = ["block-diffusion", "nemo-rl"]

[dependency-groups]
test = ["pytest>=7.0.0"]

[tool.uv.sources]
block-diffusion = { workspace = true }
nemo-rl = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["d_opsd"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["../just_grpo", "../just_grpo/tests/unit"]
