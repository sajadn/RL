defaults: ../d_opsd.yaml
d_opsd:
  runtime: reference_vllm
policy:
  generation:
    backend: vllm
    refit_transport: null
    worker_extension_cls_fqn: block_diffusion.generation.reference_vllm.ReferenceVllmWorker
    vllm_cfg:
      async_engine: false
    vllm_kwargs:
      diffusion_config:
        canvas_length: ${d_opsd.sampling.block_size}
        max_denoising_steps: ${d_opsd.sampling.max_steps}
        temperature: ${d_opsd.sampling.temperature}
        selection_policy: ${d_opsd.sampling.selection_policy}
        confidence_threshold: ${d_opsd.sampling.threshold}
        return_entropy: ${d_opsd.sampling.returns_entropy}
        return_reveal_steps: ${d_opsd.sampling.returns_reveal_steps}
        emit_full_blocks: ${d_opsd.sampling.emit_full_blocks}
logger:
  log_dir: results/d_opsd_sudoku6x6_vllm
